name: Waitlist from GitHub issue
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  ingest:
    if: >-
      contains(github.event.issue.title, '[Waitlist]') ||
      contains(join(github.event.issue.labels.*.name, ','), 'waitlist')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os, re

          title = os.environ.get("TITLE") or ""
          body = os.environ.get("BODY") or ""

          email = ""
          for pat in (
              r"###\s*Email\s*\n+\s*([^\n#]+)",
              r"\*\*Email\*\*\s*\n\s*([^\n]+)",
          ):
              m = re.search(pat, body, re.I)
              if m:
                  email = m.group(1).strip().lower()
                  break
          if not email:
              m = re.search(r"([^\s@]+@[^\s@]+\.[^\s@]+)", body)
              if m:
                  email = m.group(1).strip().lower()
          if not email and "[waitlist]" in title.lower():
              rest = re.sub(r"^\[?\s*waitlist\s*\]?\s*", "", title, flags=re.I).strip()
              if "@" in rest:
                  email = rest.split()[0].strip().lower()

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not email or "@" not in email:
              out.write("skip=true\n")
          else:
              out.write("skip=false\n")
              out.write(f"email={email}\n")
          PY

      - name: Close issue
        if: steps.parse.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Thanks — you're on the MirrorUE Pro waitlist. This issue was auto-closed after recording your signup."
          gh issue close "${{ github.event.issue.number }}"
