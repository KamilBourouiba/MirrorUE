name: Waitlist ingest

on:
  repository_dispatch:
    types: [waitlist-signup]
  workflow_dispatch:
    inputs:
      email:
        description: Email address
        required: true
      plan:
        description: pro or fleet
        required: true
        default: pro
      company:
        description: Company (optional)
        required: false
      note:
        description: Note (optional)
        required: false
      source:
        description: Source tag
        required: false
        default: manual

permissions:
  contents: read
  actions: read

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous export
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: waitlist-export
          path: data/

      - name: Append waitlist entry
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_EMAIL: ${{ github.event.inputs.email }}
          INPUT_PLAN: ${{ github.event.inputs.plan }}
          INPUT_COMPANY: ${{ github.event.inputs.company }}
          INPUT_NOTE: ${{ github.event.inputs.note }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, datetime, re

          path = pathlib.Path("data/waitlist.json")
          path.parent.mkdir(parents=True, exist_ok=True)

          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
          else:
              data = {"version": 1, "updatedAt": None, "entries": []}

          entries = data.get("entries") or []

          payload_raw = os.environ.get("PAYLOAD") or "{}"
          try:
              payload = json.loads(payload_raw) if payload_raw.strip() not in ("", "null") else {}
          except json.JSONDecodeError:
              payload = {}

          def clamp(value, limit):
              return re.sub(r"\s+", " ", (value or "").strip())[:limit]

          email = clamp(payload.get("email") or os.environ.get("INPUT_EMAIL") or "", 254).lower()
          plan = clamp(payload.get("plan") or os.environ.get("INPUT_PLAN") or "pro", 16).lower()
          if not email or "@" not in email:
              raise SystemExit("Valid email required")
          if plan not in ("pro", "fleet"):
              plan = "pro"

          entry = {
              "email": email,
              "plan": plan,
              "company": clamp(payload.get("company") or os.environ.get("INPUT_COMPANY") or "", 120),
              "note": clamp(payload.get("note") or os.environ.get("INPUT_NOTE") or "", 500),
              "source": clamp(payload.get("source") or os.environ.get("INPUT_SOURCE") or "dispatch", 64),
              "createdAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
          }

          if any(e.get("email") == email for e in entries):
              print(f"Already on list: {email}")
          else:
              entries.append(entry)
              print(f"Added: {email} ({entry['plan']})")

          data["entries"] = entries
          data["updatedAt"] = entry["createdAt"]
          data["version"] = 1
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Upload waitlist export
        uses: actions/upload-artifact@v4
        with:
          name: waitlist-export
          path: data/waitlist.json
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Waitlist updated. Download the **waitlist-export** artifact from this workflow run."
          echo "Emails are not committed to the public repository."
